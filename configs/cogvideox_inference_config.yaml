# Recipe used for the baseline-diagnosis showcase (scripts/run_i2v_showcase.py).
# Both inputs use the same generation settings; only the input image and prompt differ.

model:
  model_id: "THUDM/CogVideoX-5b-I2V"
  dtype: "bfloat16"

input:
  input_dir: "./inputs"        # candle.jpg (sweet spot), robot_cube.jpg (weak spot)
  target_width: 720
  target_height: 480

generation:
  num_inference_steps: 50
  guidance_scale: 6.0
  num_frames: 49
  fps: 8
  seed: 42
  negative_prompt: "inconsistent motion, blurry motion, worse quality, degenerate outputs, deformed outputs"

output:
  output_dir: "./outputs"      # mp4 files are gitignored

environment:
  torch: "2.6.0+cu124"
  diffusers: "0.38.0"
  transformers: "4.49.0"
  accelerate: "1.14.0"
  gpu: "NVIDIA RTX A6000 48GB"